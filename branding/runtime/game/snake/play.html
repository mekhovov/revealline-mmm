<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake · Coupa Village</title><link rel="stylesheet" href="coupa-snake.css"><script type="module" src="coupa-snake.mjs"></script></head>
<body><header><a href="../index.html">← Coupa Village</a><span>MAKE CONNECTIONS. MAKE ROOM FOR TOMORROW.</span></header>
<main><section id="library"><p class="eyebrow">COUPA ARCADE</p><h1>Snake<span>Connect your next move.</span></h1><p>Collect connection tokens, deliver parcels, and build a path together.</p>
<div class="setup"><label>Play mode<select id="mode"><option value="solo">Solo</option><option value="versus">Versus · matched boards</option><option value="team">Team · shared board</option></select></label><label>Pace<select id="pace"><option value="slow">Relaxed</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></label><label>Collection<select id="campaign"></select></label><label>Chapter<select id="chapter"></select></label></div>
<p id="progress" role="status"></p><div id="missions" class="missions"></div></section>
<section id="play" hidden><div class="play-heading"><div><p class="eyebrow" id="mode-label"></p><h1 id="mission-title"></h1></div><button id="menu">Missions</button></div><p id="briefing"></p><p id="status" role="status" aria-live="polite"></p><div id="boards"></div><div class="toolbar"><button id="pause">Start</button><button id="retry">Restart</button><button id="next" hidden>Next mission →</button><button id="export">Export round</button><button id="fullscreen">Full screen</button></div><p class="controls">Player 1: Arrow keys · Player 2: W A S D · Space or Esc: Pause · Gamepads: direction pad or left stick</p><div id="touch-controls"></div></section>
<aside><button id="restore" hidden>Resume saved round</button><label class="import">Restore exported round<input type="file" id="import" accept="application/json,.json"></label><label><input type="checkbox" id="motion"> Reduce animation</label><label><input type="checkbox" id="sound"> Collection sounds</label><p id="notice" role="status"></p></aside>
</main><footer>Coupa Village · Snake <span id="catalog-count"></span></footer></body></html>

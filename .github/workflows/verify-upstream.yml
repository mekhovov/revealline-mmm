name: Verify pinned upstream extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproduce committed app from the exact remote upstream commit
        run: |
          source_sha="$(node -p "require('./upstream.lock.json').commit")"
          npm run sync:upstream -- --ref "$source_sha" --check
      - run: npm test
